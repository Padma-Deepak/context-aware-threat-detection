name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            agent/requirements.txt
            requirements-triage.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit tests (scripted/replayed LLM, no network, no database, no API key)
        env:
          TRIAGE_CACHE: replay
          TRIAGE_INTEL_CACHE: replay
        run: pytest -q -m "not db and not excytin"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secinvest
          POSTGRES_PASSWORD: secinvest_local_only
          POSTGRES_DB: secinvest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secinvest -d secinvest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://secinvest:secinvest_local_only@localhost:5432/secinvest
      PGPASSWORD: secinvest_local_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            agent/requirements.txt
            requirements-triage.txt
      - run: pip install -r requirements-dev.txt
      - name: Generated scenarios are reproducible from the committed seed
        run: |
          python scripts/generate_scenarios.py --n 48 --seed 20260930
          git diff --exit-code scenarios_generated.json db/seed_generated.sql
      - name: Load schema and every seed file
        run: |
          psql -h localhost -U secinvest -d secinvest -v ON_ERROR_STOP=1 -f db/schema.sql
          for f in db/seed.sql db/seed_holdout.sql db/seed_longhorizon.sql db/seed_injection.sql db/seed_generated.sql; do
            psql -h localhost -U secinvest -d secinvest -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Data-layer tests and label verification against live Postgres
        run: pytest -q -m db

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Triage image builds and imports
        run: |
          docker build -f Dockerfile.triage -t soc-triage .
          docker run --rm soc-triage python -c "import triage.cli, triage.mcp_server; print('ok')"
