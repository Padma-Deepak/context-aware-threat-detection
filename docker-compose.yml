services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secinvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secinvest_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-secinvest}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Numbered so docker-entrypoint-initdb.d runs schema before seed,
      # on first container start only (an existing pgdata volume skips
      # re-running these).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secinvest} -d ${POSTGRES_DB:-secinvest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secinvest}:${POSTGRES_PASSWORD:-secinvest_local_only}@postgres:5432/${POSTGRES_DB:-secinvest}
    ports:
      - "8000:8000"

volumes:
  pgdata:
